<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tilt Labyrinth: the orrery</title>
<style>

    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 12px) 14px 0 14px; pointer-events: none; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .buttons { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid #f0b45a; outline-offset: 2px; }
  .hint { position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px); font-size: 13px; color: var(--dim);
    pointer-events: none; max-width: 75vw; transition: opacity .8s; }
  .panel { position: fixed; left: 14px; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px); max-width: 400px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-height: calc(100% - 90px); overflow: auto; }
  .panel h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .panel .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 4px; }
  .panel p { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .card { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%); width: min(340px, calc(100% - 28px));
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: center; transition: opacity .6s, transform .6s; }
  .card.fade { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
  .card .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 4px; }
  .card h2 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .card p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .card .row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .seg { display: flex; gap: 0; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: fit-content; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .seg small { display: block; font-size: 11px; opacity: .75; }
  .levels { list-style: none; margin: 0 0 12px; padding: 0; border-top: 1px solid var(--line); }
  .levels li { border-bottom: 1px solid var(--line); }

  .levels .done { color: #8a5a16; }

  .tune .row { margin-top: 14px; }

    font-size: 13px; padding: 8px 12px; border-radius: 8px; max-width: 80vw; pointer-events: none; transition: opacity .3s; opacity: 0; }
  .toast.show { opacity: 1; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; pointer-events: none; }
  .stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 1.5px solid rgba(239,233,224,.3); pointer-events: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    background: rgba(239,233,224,.35); }
</style>
<script src="assets.js"></script>
</head>
<body>
<canvas id="c" aria-label="The orrery. Drag anywhere, or use the arrow keys, to tilt the board."></canvas>
<div id="loading" class="loading">Polishing the brass&hellip;</div>
<div class="hud">
  <div class="label" id="hudLabel">Tilt Labyrinth</div>
  <div class="buttons">
    <button id="btnLevels">Levels</button>
    <button id="btnRecal" class="hidden">Reset flat</button>
    <button id="btnView" class="hidden">Whole board</button>
    <button id="btnRestart" class="hidden">Restart</button>
    <button id="btnTune">Tune</button>
  </div>
</div>
<div id="hint" class="hint hidden"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="stick" class="stick hidden"><i></i></div>

<div id="select" class="panel hidden">
  <p class="eyebrow">Tilt Labyrinth</p>
  <h1>The orrery</h1>
  <div class="seg" role="group" aria-label="Mode"><button id="mEasy" class="on" aria-pressed="true">Stargazer<small>easier steering</small></button><button id="mStd" aria-pressed="false">Astronomer<small>standard</small></button></div>
  <ul class="levels" id="levelList"></ul>
</div>
<div id="start" class="panel hidden">
  <p class="eyebrow" id="startEyebrow"></p>
  <h1 id="startTitle"></h1>
  <p id="startIntro"></p>
  <div class="row" id="startFirst"><button id="btnTilt" class="primary">Use tilt</button><button id="btnDrag">Use drag</button><button id="btnBack1">All levels</button></div>
  <div class="row hidden" id="startAgain"><button id="btnPlay" class="primary">Play</button><button id="btnBack2">All levels</button></div>
</div>
<div id="card" class="card fade" role="status" aria-live="polite"><p class="eyebrow" id="cardEyebrow"></p><h2 id="cardTitle"></h2><p id="cardText"></p><div class="row" id="cardRow"><button id="btnStay">Stay on this level</button></div></div>
<div id="win" class="panel hidden">
  <h1 id="winTitle">Home to the sun.</h1>
  <p id="winText"></p>
  <div class="row"><button id="btnNext" class="primary">Next level</button><button id="btnAgain">Play again</button><button id="btnBack3">All levels</button></div>
</div>
<div id="tune" class="panel tune hidden">
  <h1>Tune the feel</h1>
  <label>Sensitivity <span id="vSens"></span></label><input id="sens" type="range" min="0.3" max="1.6" step="0.05">
  <label>Steepest tilt <span id="vMax"></span></label><input id="maxTilt" type="range" min="4" max="16" step="1">
  <label>Ball weight (rolling friction) <span id="vFric"></span></label><input id="fric" type="range" min="0.05" max="1.5" step="0.05">
  <label>Bounce off rails <span id="vBounce"></span></label><input id="bounce" type="range" min="0" max="0.7" step="0.05">
  <label>Speed of moving things <span id="vArm"></span></label><input id="arm" type="range" min="0" max="2" step="0.1">
  <label>Wormhole look (exploring)</label><div class="seg" role="group" aria-label="Wormhole look" id="wormSeg"><button data-w="porthole" class="on" aria-pressed="true">Porthole</button><button data-w="orbit" aria-pressed="false">Orbit</button><button data-w="engraved" aria-pressed="false">Engraved</button></div>
  <label class="check"><input id="easy" type="checkbox"> Stargazer mode (easier steering)</label>
  <label class="check"><input id="still" type="checkbox"> Keep the board still on screen</label>
  <label class="check"><input id="sound" type="checkbox"> Sound</label>
  <div class="row"><button id="btnTuneClose" class="primary">Done</button><button id="btnTuneReset">Reset to default</button></div>
</div>
